name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,llm]"
      - run: ruff check src tests
      - run: pytest --cov --cov-report=term-missing:skip-covered
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arrivalguard:ci .
      - name: smoke
        run: |
          docker run -d --name ag -p 8000:8000 -e SCHEDULER_INTERVAL_S=0 arrivalguard:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs ag; exit 1
